<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Promodoro B-roll</title>
<!--
  B-roll control room. With `npm run dev` running, open this file in a browser (or serve the folder),
  pick a clip, and screen-capture the phone (OBS: Window/Browser capture cropped to the frame).
  "Clean" hides everything but the 414×736 (9:16) screen, for a chroma/plain-background capture.
  The clips themselves live in src/dev/broll/clips.ts; each runs the real app at /?broll=<clip>.
-->
<style>
  :root { --bg: #f3efe6; --ink: #2d312e; --tomato: #ee6b6e; --chip: #fffefb; --rule: #e5dfd1; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif;
    display: flex; gap: 32px; align-items: center; justify-content: center; padding: 24px 16px; flex-wrap: wrap; }
  .panel { width: 300px; max-width: 100%; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--tomato); }
  p { margin: 0 0 16px; color: rgb(45 49 46 / 0.65); font-size: 13px; }
  .clips { display: grid; gap: 6px; }
  button { font: inherit; text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--rule);
    background: var(--chip); color: var(--ink); cursor: pointer; }
  button small { display: block; color: rgb(45 49 46 / 0.55); font-size: 12px; }
  button.on { background: #ffe893; border-color: #ffe893; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; font-size: 13px; }
  .row input[type=number] { width: 64px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--rule); }
  #state { font-size: 12px; color: rgb(45 49 46 / 0.6); margin-top: 10px; min-height: 1.4em; }
  .phone { width: 438px; height: 760px; padding: 12px; border-radius: 56px; background: #1d1f1e; box-shadow: 0 30px 60px -30px rgb(0 0 0 / 0.5); flex-shrink: 0; }
  .screen { width: 414px; height: 736px; border-radius: 44px; overflow: hidden; background: #fdfbf7; }
  iframe { width: 414px; height: 736px; border: 0; display: block; }
  body.clean { background: #00b140; }
  body.clean .panel { display: none; }
  body.clean .phone { padding: 0; background: none; box-shadow: none; border-radius: 0; width: 414px; height: 736px; }
  body.clean .screen { border-radius: 0; }
  @media (max-width: 460px) { .phone { transform: scale(0.8); transform-origin: top center; margin-bottom: -170px; } }
</style>
</head>
<body>
  <div class="panel">
    <h1>Promodoro B-roll</h1>
    <p>Each clip drives the real app (preview notebook, re-seeded per take). Needs <code>npm run dev</code> on port 1420.</p>
    <div class="clips" id="clips"></div>
    <div class="row">
      <label>Pace <input id="pace" type="number" min="0.5" max="2" step="0.05" value="1" /></label>
      <label><input id="clean" type="checkbox" /> Clean (green screen)</label>
    </div>
    <div class="row"><label>Dev server <input id="base" value="http://localhost:1420" style="width: 180px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--rule)" /></label></div>
    <div id="state">Pick a clip.</div>
  </div>
  <div class="phone"><div class="screen"><iframe id="screen" title="Promodoro"></iframe></div></div>

<script>
  const CLIPS = [
    ['intro', 'Built Promodoro · no paywalls', '~13 s'],
    ['stats', 'Bar graphs, pie charts, heat maps, insights', '~15 s'],
    ['export', 'Data on your device · export in a click', '~12 s'],
    ['import', 'Bring your past sessions in', '~24 s'],
    ['sync', 'Sync across devices in a click', '~9 s'],
    ['timeline', 'Forgot to track? Claim it on the timeline', '~13 s'],
    ['flow', 'Gentle Flow · overtime keeps counting', '~23 s'],
    ['subjects', 'Tasks & folders', '~10 s'],
    ['outro', 'Everything free · tour of the tabs', '~20 s'],
    ['custom', 'Custom Pomodoro length (45 → 35 min)', '~16 s'],
    ['clock', 'Drag the ring to move the clock', '~25 s'],
    ['reel', 'Everything back to back', '~2 min'],
  ];
  const $ = (id) => document.getElementById(id);
  const frame = $('screen');
  let current = null;

  for (const [id, label, dur] of CLIPS) {
    const b = document.createElement('button');
    b.innerHTML = `<b>${id}</b> · ${dur}<small>${label}</small>`;
    b.onclick = () => play(id, b);
    $('clips').appendChild(b);
  }

  function play(id, btn) {
    document.querySelectorAll('.clips button').forEach((x) => x.classList.toggle('on', x === btn));
    current = id;
    $('state').textContent = `Loading ${id}…`;
    frame.src = `${$('base').value.replace(/\/+$/, '')}/?broll=${id}&pace=${$('pace').value}&t=${Date.now()}`;
  }

  // The clip reports its state on window.__broll; the iframe is same-origin only when served by Vite,
  // so poll defensively.
  setInterval(() => {
    try {
      const s = frame.contentWindow && frame.contentWindow.__broll;
      if (s && current) $('state').textContent = s.state === 'error' ? `Error: ${s.error}` : `${s.clip}: ${s.state}`;
    } catch {
      /* cross-origin (file://): no status, the clip still plays */
    }
  }, 300);

  $('clean').onchange = (e) => document.body.classList.toggle('clean', e.target.checked);
</script>
</body>
</html>
