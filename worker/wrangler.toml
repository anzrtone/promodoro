name = "promodoro-api"
main = "index.js"
compatibility_date = "2025-01-01"

# Fill in database_id after `npx wrangler d1 create promodoro` (see README.md).
[[d1_databases]]
binding = "DB"
database_name = "promodoro"
database_id = "80f2f270-d727-4811-8c3c-c2616b1fac51"

[[r2_buckets]]
binding = "SYNC"
bucket_name = "promodoro-sync"

# Per-address cap on writes (PUT/DELETE/POST): 20 a minute. The address is never stored. If your plan or
# wrangler version doesn't support this binding, delete the block; the Worker runs fine without it.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60
