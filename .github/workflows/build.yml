# Builds the two shipping artifacts:
#   • Windows installer (.exe via NSIS, plus .msi) and a portable promodoro.exe
#   • Android APK (signed if keystore secrets exist, otherwise a sideloadable debug APK)
# Push a tag like v0.1.0 to also publish them as a GitHub Release.
name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Only tagged builds of the upstream repo talk to the official Worker (see src/config/api.ts).
  # Forks, branches and pull requests build an app that never touches the network.
  VITE_OFFICIAL_BUILD: ${{ github.repository == 'anzrtone/promodoro' && startsWith(github.ref, 'refs/tags/v') }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --bundles nsis,msi
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Copy-Item src-tauri/target/release/promodoro.exe out/Promodoro-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: promodoro-windows
          path: out/*

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Version
        run: |
          echo "PROMODORO_VERSION_NAME=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "PROMODORO_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/promodoro.jks
          echo "PROMODORO_KEYSTORE=$RUNNER_TEMP/promodoro.jks" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        env:
          PROMODORO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROMODORO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PROMODORO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$PROMODORO_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Promodoro-${PROMODORO_VERSION_NAME}.apk
          else
            echo "::warning::No signing secrets set; building a debug-signed APK (installs fine, but can't be updated by a release-signed build)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Promodoro-${PROMODORO_VERSION_NAME}-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: promodoro-android
          path: Promodoro-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
